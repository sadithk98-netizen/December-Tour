<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিসেম্বর ব্যাচেলর ট্যুর ২০২৬</title>
    <!-- FontAwesome Web Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Extension -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-col: column;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }
        
        /* 📢 Top Announcement Neon Ticker */
        .ticker-banner {
            width: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            text-align: center;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ✨ Premium Cyber-Glass Cards */
        .glass-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-box:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        /* Logo Profile Structure */
        .logo-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .icon-wrapper {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }
        .logo-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        .logo-header p {
            font-size: 11px;
            color: #818cf8;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* 📅 Calendar Engine Styles */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-b: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }
        .calendar-wrapper {
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 16px;
            border-radius: 16px;
            margin-top: 12px;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-cols: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .calendar-grid {
            display: grid;
            grid-template-cols: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }
        .day-cell {
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .day-cell:hover {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
        }
        .day-cell.selected {
            background: linear-gradient(135deg, #6366f1, #a855f7) !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            border-color: transparent;
            transform: scale(1.05);
        }
        .counter-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .counter-number {
            background: #6366f1;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* 🗳️ Poll Inputs & Discussion Layouts */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .modern-input {
            flex: 1;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 14px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .modern-input:focus {
            border-color: #6366f1;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #4f46e5; }
        
        .poll-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .poll-item:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.1);
        }
        .vote-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .vote-count {
            font-size: 11px;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .btn-vote {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-vote:hover {
            background: #6366f1;
            color: white;
            border-color: transparent;
        }

        /* Discussion Chat Section */
        .chat-container {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 16px;
        }
        .chat-feed {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-h: 150px;
            overflow-y: auto;
            margin-top: 12px;
            padding-right: 4px;
        }
        .chat-bubble {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .chat-user {
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 2px;
        }

        /* 🎲 Spinning Lottery Wheel Elements */
        .wheel-center-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .wheel-box {
            position: relative;
            width: 290px;
            height: 290px;
            margin: 20px 0;
        }
        canvas#wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #f43f5e;
            filter: drop-shadow(0 0 8px rgba(244,63,94,0.6));
            z-index: 50;
        }

            position: absolute;
